# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:myuser}
quarkus.datasource.password=${DB_PASSWORD:mypassword}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}

# Hibernate — validate schema managed by Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# HTTP
quarkus.http.port=8080

# Logging
quarkus.log.level=INFO
quarkus.log.category."overton.window".level=DEBUG
